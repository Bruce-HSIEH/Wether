<style>
/* Layout: one-screen phone app — live canvas diorama on top, control tray below */
:root{
  --bg:#0d1a20; --panel:#13252d; --panel2:#18303a; --line:#26434f;
  --fg:#e9f2ef; --mute:#8fa8ad; --sun:#ffd23f; --cold:#6ec1ff; --hot:#ff6a4d; --ok:#5fd08a;
  --display:'Fredoka','Noto Sans TC',system-ui,sans-serif;
  --body:'Noto Sans TC',-apple-system,'PingFang TC',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 24px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.loc{min-width:0;display:flex;flex-direction:column}
.loc b{font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc small{color:var(--mute);font-size:12px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.seg button{all:unset;cursor:pointer;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--sun);color:#1b1a10}
button:focus-visible{outline:2px solid var(--cold);outline-offset:2px}

.stage{position:relative;height:58vh;height:clamp(330px,58svh,560px);border-radius:22px;overflow:hidden;background:#3d8fe0;max-width:100%}
canvas{display:block;position:absolute;inset:0}
.readout{position:absolute;left:12px;top:12px;padding:8px 14px 10px;border-radius:16px;background:rgba(8,18,24,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;max-width:calc(100% - 70px)}
.big{font-family:var(--display);font-weight:600;font-size:50px;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.big sup{font-size:20px;vertical-align:top;margin-left:2px;position:relative;top:6px}
.feel{font-size:13px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.feel b{font-family:var(--display);font-size:16px}
.cond{font-weight:700;font-size:14px;margin-top:2px}
.meta{font-size:12px;opacity:.85;margin-top:2px}
.ib{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(8,18,24,.45);color:#fff;display:grid;place-items:center;cursor:pointer}
.ib svg{width:20px;height:20px}
.ib.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.evtag{position:absolute;right:12px;top:60px;max-width:46%;padding:6px 10px;border-radius:12px;background:rgba(255,106,77,.92);color:#2a0700;font-size:12px;font-weight:900;text-align:right}
.status{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;padding:9px 12px;border-radius:14px;background:rgba(8,18,24,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:14px;font-weight:500}
.srow{display:flex;align-items:center;gap:8px}
.pill{flex:none;font-size:12px;font-weight:900;padding:3px 9px;border-radius:999px;background:var(--ok);color:#0b2416;letter-spacing:.06em}
.pill.warn{background:var(--sun);color:#2a2100}
.pill.danger{background:var(--hot);color:#2a0700}
.pill.dead{background:#e9f2ef;color:#111}
.pill.off{background:#5b6b70;color:#fff}
#statusText{min-width:0;line-height:1.4}
.hp{display:flex;align-items:center;gap:8px;font-size:11px;color:#cfe0e3;font-variant-numeric:tabular-nums}
.hp .track{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.hp .fill{height:100%;border-radius:99px;background:var(--ok);transition:width .3s,background .3s}

.notice{background:#2a2410;border:1px solid #5a4b17;color:#ffe9a6;border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.55}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:14px}
.ctl{display:flex;flex-direction:column;gap:7px}
.ctl label{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:14px}
.ctl label b{font-family:var(--display);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:999px;margin:6px 0 0;outline:none}
input.temp{background:linear-gradient(90deg,#5a7dff 0%,#6ec1ff 25%,#bfe6ff 38.9%,#8fe0a0 50%,#ffe066 66%,#ff9b4a 78%,#ff4d3d 90%,#b0132a 100%)}
input.rain{background:linear-gradient(90deg,#3a4c55 0%,#4f8fb8 10%,#3a6fe0 27%,#5546d9 53%,#2a1a7a 100%)}
input.wind{background:linear-gradient(90deg,#3a5550 0%,#5fb8a0 20.7%,#d8c05a 39.3%,#e07a3a 61.3%,#b0204a 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--bg)}
.ticks{position:relative;height:16px;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ticks span:first-child{transform:none}
.ticks span:last-child{transform:translateX(-100%)}
.ticks em{font-style:normal;color:var(--fg)}

.sub{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--mute);letter-spacing:.04em}
.sub button{border:0;background:none;color:var(--sun);font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:4px 0}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-top:-6px}
.row::-webkit-scrollbar,.hours::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:inherit;font-size:13px;font-weight:700;padding:8px 12px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left}
.chip small{font-weight:500;color:var(--mute);font-size:11px;font-variant-numeric:tabular-nums}
.chip.dis{border-color:#5a3328;background:#2a1d1a}
.chip.on{border-color:var(--sun);background:#3a3313}
.chip:active{transform:scale(.97)}
.equip{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;margin-top:-6px}
.eq{border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:inherit;border-radius:12px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-width:0}
.eq b{font-size:13px}
.eq small{font-size:11px;color:var(--mute)}
.eq.cool small{color:var(--cold)}
.eq.warm small{color:#ffab7a}
.eq[aria-pressed="true"]{border-color:var(--ok);background:#1d3a2a}
.eq[aria-pressed="true"] b::after{content:" ✓";color:var(--ok)}
.calc{font-size:12px;color:var(--mute);line-height:1.6;background:rgba(255,255,255,.03);border-radius:10px;padding:8px 10px;font-variant-numeric:tabular-nums}
.calc b{color:var(--fg)}
.hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:-6px;scrollbar-width:none}
.hr{flex:none;width:54px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:7px 0 6px;color:var(--fg);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.hr .h{font-size:11px;color:var(--mute)}
.hr .t{font-family:var(--display);font-size:16px;font-weight:600}
.hr .bar{width:24px;height:22px;display:flex;align-items:flex-end;justify-content:center;background:rgba(255,255,255,.04);border-radius:4px}
.hr .bar i{display:block;width:100%;background:var(--cold);border-radius:3px}
.hr .r{font-size:10px;color:var(--cold)}
.hr.now{border-color:var(--sun)}
.hr.sel{background:#2b3f22;border-color:var(--ok)}
.empty{font-size:13px;color:var(--mute);margin-top:-6px}
@media (prefers-reduced-motion:reduce){.ib.spin svg{animation:none}}
</style>

<div class="app">
  <header class="top">
    <div class="loc"><b id="place">定位中…</b><small id="updated">準備抓取所在地天氣</small></div>
    <div class="seg" role="group" aria-label="資料來源">
      <button id="mReal" class="on" type="button" aria-pressed="true">實際天氣</button>
      <button id="mSim" type="button" aria-pressed="false">模擬</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="天氣與小人動畫"></canvas>
    <div class="readout">
      <div class="big"><span id="tNow">--</span><sup>°C</sup></div>
      <div class="feel">體感 <b id="fNow">--</b>°C</div>
      <div class="cond" id="cond">--</div>
      <div class="meta" id="meta"></div>
    </div>
    <button class="ib" id="refresh" type="button" aria-label="重新抓取天氣">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
    </button>
    <div class="evtag" id="evtag" hidden></div>
    <div class="status">
      <div class="srow"><span class="pill" id="pill">舒適</span><span id="statusText">準備出門散步</span></div>
      <div class="hp"><span>體況</span><span class="track"><span class="fill" id="hpFill" style="width:100%"></span></span><span id="hpNum">100</span></div>
    </div>
  </div>

  <div class="notice" id="notice" hidden></div>

  <section class="panel">
    <div class="ctl">
      <label for="tR">氣溫 <b id="tV">22°C</b></label>
      <input type="range" id="tR" class="temp" min="-35" max="55" step="0.5" value="22">
      <div class="ticks"><span style="left:0">-35</span><span style="left:38.9%">0</span><span style="left:61.1%">20</span><span style="left:77.8%">35</span><span style="left:100%">55°</span></div>
    </div>
    <div class="ctl">
      <label for="rR">雨量 <b id="rV">0 mm/h</b></label>
      <input type="range" id="rR" class="rain" min="0" max="150" step="1" value="0">
      <div class="ticks"><span style="left:0">0</span><span style="left:26.7%"><em>40 大雨</em></span><span style="left:53.3%">80</span><span style="left:100%">150 mm/h</span></div>
    </div>
    <div class="ctl">
      <label for="wR">風速 <b id="wV">10 km/h</b></label>
      <input type="range" id="wR" class="wind" min="0" max="300" step="1" value="10">
      <div class="ticks"><span style="left:0">0</span><span style="left:20.7%"><em>62 輕颱</em></span><span style="left:39.3%">118 中颱</span><span style="left:61.3%">184 強颱</span><span style="left:100%">300</span></div>
    </div>

    <div class="sub"><span>天氣情境</span><button id="reset" type="button">重新開始</button></div>
    <div class="row" id="scW"></div>
    <div class="sub"><span>災害情境</span></div>
    <div class="row" id="scD"></div>

    <div class="sub"><span>裝備</span><span id="eqCount"></span></div>
    <div class="equip" id="equip"></div>
    <div class="calc" id="calc"></div>

    <div class="sub"><span>今日逐時預報</span><button id="play" type="button">▶ 播放今天</button></div>
    <div class="hours" id="hours"></div>
  </section>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, ease=t=>t*t*(3-2*t), R1=()=>Math.random();
const hc={};function rgb(h){if(typeof h!=='string')return h;if(hc[h])return hc[h];const n=parseInt(h.slice(1),16);return hc[h]=[n>>16&255,n>>8&255,n&255]}
function mix(a,b,t){t=clamp(t,0,1);const A=rgb(a),B=rgb(b);return[A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t]}
function css(c,al=1){c=rgb(c);return`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${al})`}
const shade=(c,k)=>mix(c,'#0b1620',k);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- data ---------- */
const EQUIP=[
  {id:'fan',n:'手持電風扇',d:-3,tag:'體感 -3°C',k:'cool'},
  {id:'drink',n:'冰涼飲料',d:-5,tag:'體感 -5°C',k:'cool'},
  {id:'towel',n:'冰涼毛巾',d:-2,tag:'體感 -2°C',k:'cool'},
  {id:'vest',n:'冷卻背心',d:-6,tag:'體感 -6°C',k:'cool'},
  {id:'parasol',n:'陽傘',d:0,tag:'晴天遮陽 -3°C',k:'cool'},
  {id:'warmer',n:'暖暖包',d:4,tag:'體感 +4°C',k:'warm'},
  {id:'cocoa',n:'熱可可',d:5,tag:'體感 +5°C',k:'warm'},
  {id:'thermal',n:'發熱衣',d:6,tag:'體感 +6°C',k:'warm'},
  {id:'life',n:'救生衣',tag:'淹水不會溺斃'},
  {id:'helmet',n:'安全帽',tag:'擋冰雹、落物'},
  {id:'mask',n:'防毒面具',tag:'擋沙塵、火山灰'},
  {id:'rope',n:'安全繩',tag:'強風不被吹走'},
  {id:'shelter',n:'避難所',tag:'擋風與各種災害'}];
const SCEN=[
  {id:'spring',g:'w',n:'舒適春日',t:23,r:0,w:8},
  {id:'storm',g:'w',n:'午後雷陣雨',t:31,r:35,w:30},
  {id:'flood',g:'w',n:'豪雨淹水',t:25,r:120,w:40},
  {id:'chill',g:'w',n:'寒流來襲',t:6,r:1,w:25},
  {id:'polar',g:'w',n:'極地酷寒',t:-32,r:0,w:20},
  {id:'heat',g:'w',n:'熱浪',t:42,r:0,w:5},
  {id:'deadly',g:'w',n:'致命高溫',t:52,r:0,w:5},
  {id:'typhoon',g:'d',n:'颱風',t:27,r:55,w:130,ev:'typhoon'},
  {id:'tornado',g:'d',n:'龍捲風',t:24,r:20,w:45,ev:'tornado'},
  {id:'meteor',g:'d',n:'隕石撞擊',t:24,r:0,w:10,ev:'meteor'},
  {id:'shower',g:'d',n:'流星雨',t:18,r:0,w:5,ev:'shower'},
  {id:'hail',g:'d',n:'冰雹',t:16,r:20,w:35,ev:'hail'},
  {id:'lightning',g:'d',n:'雷擊',t:28,r:20,w:40,ev:'lightning'},
  {id:'sand',g:'d',n:'沙塵暴',t:34,r:0,w:85,ev:'sand'},
  {id:'blizzard',g:'d',n:'暴風雪',t:-10,r:30,w:70,ev:'blizzard'},
  {id:'volcano',g:'d',n:'火山爆發',t:36,r:0,w:15,ev:'volcano'},
  {id:'quake',g:'d',n:'大地震',t:22,r:0,w:5,ev:'quake'},
  {id:'tsunami',g:'d',n:'海嘯',t:25,r:5,w:30,ev:'tsunami'}];
const EVNAME={typhoon:'颱風登陸',tornado:'龍捲風接近中',meteor:'隕石來襲',shower:'流星雨',hail:'冰雹轟炸',lightning:'強烈雷暴',sand:'沙塵暴',blizzard:'暴風雪',volcano:'火山爆發',quake:'強烈地震',tsunami:'海嘯警報'};

/* ---------- state ---------- */
const st={mode:'real',real:null,realState:'loading',sim:{t:22,r:0,w:10},simHour:null,
  cur:{t:22,r:0,w:10,cloud:.2,day:1,wind:.08,code:1,feels:22},
  water:0,snow:0,rot:0,rv:0,hipUp:44,walk:1,phase:0,scroll:0,time:0,px:0,
  ps:{pose:'walk',speed:1},lastPose:'walk',poseT:9,fromUp:false,ang:{},
  pony:0,ponyV:0,blink:0,nextBlink:2,dress:0,sig:'',umb:null,hands:{},

  }finally{loading=false;$('refresh').classList.remove('spin');ui()}}
function showPlace(stale){const R=st.real;$('place').textContent=R.place||'目前位置';const d=new Date(R.at);
  $('updated').textContent=`${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} 更新${stale?'（離線）':''}`}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-st.lastFetch>15*60e3)loadReal()});
setInterval(()=>{if(!document.hidden)loadReal()},30*60e3);

/* ---------- loop ---------- */
let last=performance.now(),uiAcc=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;st.time+=dt;update(dt);draw();uiAcc+=dt;if(uiAcc>.15){uiAcc=0;ui()}requestAnimationFrame(frame)}
syncSliders(22,0,10);renderHours();ui();requestAnimationFrame(frame);loadReal();
})();
</script>
