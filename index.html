</head><body><title>天氣小人</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-screen phone app — live canvas diorama on top, control tray below */
:root{
  --bg:#0d1a20; --panel:#13252d; --panel2:#18303a; --line:#26434f;
  --fg:#e9f2ef; --mute:#8fa8ad; --sun:#ffd23f; --cold:#6ec1ff; --hot:#ff6a4d; --ok:#5fd08a;
  --display:'Fredoka','Noto Sans TC',system-ui,sans-serif;
  --body:'Noto Sans TC',-apple-system,'PingFang TC',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 24px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.loc{min-width:0;display:flex;flex-direction:column}
.loc b{font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc small{color:var(--mute);font-size:12px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.seg button{all:unset;cursor:pointer;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--sun);color:#1b1a10}
.seg button:focus-visible,.chip:focus-visible,.hr:focus-visible,.ib:focus-visible{outline:2px solid var(--cold);outline-offset:2px}

.stage{position:relative;height:58vh;height:clamp(320px,58svh,560px);border-radius:22px;overflow:hidden;background:#3d8fe0;max-width:100%}
canvas{display:block;position:absolute;inset:0}
.readout{position:absolute;left:12px;top:12px;padding:8px 14px 10px;border-radius:16px;background:rgba(8,18,24,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;max-width:calc(100% - 70px)}
.big{font-family:var(--display);font-weight:600;font-size:52px;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.big sup{font-size:20px;vertical-align:top;margin-left:2px;position:relative;top:6px}
.cond{font-weight:700;font-size:15px;margin-top:4px}
.meta{font-size:12px;opacity:.85;margin-top:2px}
.ib{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(8,18,24,.42);color:#fff;display:grid;place-items:center;cursor:pointer}
.ib svg{width:20px;height:20px}
.ib.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:14px;background:rgba(8,18,24,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:14px;font-weight:500}
.pill{flex:none;font-size:12px;font-weight:900;padding:3px 9px;border-radius:999px;background:var(--ok);color:#0b2416;letter-spacing:.06em}
.pill.warn{background:var(--sun);color:#2a2100}
.pill.danger{background:var(--hot);color:#2a0700}
.pill.dead{background:#e9f2ef;color:#111}
.pill.off{background:#5b6b70;color:#fff}
#statusText{min-width:0}

.notice{background:#2a2410;border:1px solid #5a4b17;color:#ffe9a6;border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.55}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:16px}
.ctl{display:flex;flex-direction:column;gap:8px}
.ctl label{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:14px}
.ctl label b{font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:999px;margin:6px 0 0;outline:none}
input.temp{background:linear-gradient(90deg,#5a7dff 0%,#6ec1ff 25%,#bfe6ff 38.9%,#8fe0a0 50%,#ffe066 66%,#ff9b4a 78%,#ff4d3d 90%,#b0132a 100%)}
input.rain{background:linear-gradient(90deg,#3a4c55 0%,#4f8fb8 10%,#3a6fe0 27%,#5546d9 53%,#2a1a7a 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--bg)}
input[type=range]:focus-visible::-webkit-slider-thumb{border-color:var(--cold)}
.ticks{position:relative;height:16px;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ticks span:first-child{transform:none}
.ticks span:last-child{transform:translateX(-100%)}
.ticks em{font-style:normal;color:var(--fg)}

.sub{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--mute);letter-spacing:.04em}
.presets{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-top:-6px}
.presets::-webkit-scrollbar,.hours::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:inherit;font-size:13px;font-weight:700;padding:8px 12px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.chip small{font-weight:500;color:var(--mute);font-size:11px;font-variant-numeric:tabular-nums}
.chip:active{transform:scale(.97)}
.play{border:0;background:none;color:var(--sun);font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:4px 0}
.hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:-6px;scrollbar-width:none}
.hr{flex:none;width:54px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:7px 0 6px;color:var(--fg);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.hr .h{font-size:11px;color:var(--mute)}
.hr .t{font-family:var(--display);font-size:16px;font-weight:600}
.hr .bar{width:24px;height:22px;display:flex;align-items:flex-end;justify-content:center;background:rgba(255,255,255,.04);border-radius:4px}
.hr .bar i{display:block;width:100%;background:var(--cold);border-radius:3px}
.hr .r{font-size:10px;color:var(--cold)}
.hr.now{border-color:var(--sun)}
.hr.sel{background:#2b3f22;border-color:var(--ok)}
.empty{font-size:13px;color:var(--mute);margin-top:-6px}
@media (prefers-reduced-motion:reduce){.ib.spin svg{animation:none}}
</style>

<div class="app">
  <header class="top">
    <div class="loc"><b id="place">定位中…</b><small id="updated">準備抓取所在地天氣</small></div>
    <div class="seg" role="group" aria-label="資料來源">
      <button id="mReal" class="on" type="button">實際天氣</button>
      <button id="mSim" type="button">模擬</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="天氣與小人動畫"></canvas>
    <div class="readout">
      <div class="big"><span id="tNow">--</span><sup>°C</sup></div>
      <div class="cond" id="cond">--</div>
      <div class="meta" id="meta"></div>
    </div>
    <button class="ib" id="refresh" type="button" aria-label="重新抓取天氣">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
    </button>
    <div class="status"><span class="pill" id="pill">舒適</span><span id="statusText">準備出門散步</span></div>
  </div>

  <div class="notice" id="notice" hidden></div>

  <section class="panel">
    <div class="ctl">
      <label for="tR">氣溫 <b id="tV">22°C</b></label>
      <input type="range" id="tR" class="temp" min="-35" max="55" step="0.5" value="22">
      <div class="ticks"><span style="left:0">-35</span><span style="left:38.9%">0</span><span style="left:61.1%">20</span><span style="left:77.8%">35</span><span style="left:100%">55°</span></div>
    </div>
    <div class="ctl">
      <label for="rR">雨量 <b id="rV">0 mm/h</b></label>
      <input type="range" id="rR" class="rain" min="0" max="150" step="1" value="0">
      <div class="ticks"><span style="left:0">0</span><span style="left:26.7%"><em>40 大雨</em></span><span style="left:53.3%">80</span><span style="left:100%">150 mm/h</span></div>
    </div>
    <div class="sub"><span>快速模擬</span></div>
    <div class="presets" id="presets"></div>
    <div class="sub"><span id="hoursTitle">今日逐時預報</span><button class="play" id="play" type="button">▶ 播放今天</button></div>
    <div class="hours" id="hours"></div>
  </section>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, ease=t=>t*t*(3-2*t);
const hc={};function rgb(h){if(typeof h!=='string')return h;if(hc[h])return hc[h];const n=parseInt(h.slice(1),16);return hc[h]=[n>>16&255,n>>8&255,n&255]}
function mix(a,b,t){t=clamp(t,0,1);const A=rgb(a),B=rgb(b);return[A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t]}
function css(c,al=1){c=rgb(c);return`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${al})`}
const shade=(c,k)=>mix(c,'#0b1620',k);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- state ---------- */
const st={mode:'real',real:null,realState:'loading',sim:{t:22,r:0},simHour:null,
  cur:{t:22,r:0,cloud:.2,day:1,wind:.2,code:1},
  water:0,snow:0,rot:0,rv:0,hipUp:44,walk:1,phase:0,scroll:0,time:0,
  ps:{pose:'walk',speed:1},lastPose:'walk',poseT:9,ang:{},
  pony:.2,ponyV:0,blink:0,nextBlink:2,dress:0,sig:'',umb:null,
  flash:0,bolt:null,nextBolt:3,lastFetch:0};
const G={beanie:0,scarf:0,mitts:0,puffer:0,coat:0,hoodie:0,long:0,tee:1,tank:0,pants:0,jeans:0,shorts:1,raincoat:0,boots:0,umbrella:0,cap:0,shades:0,pop:0};
const COL={skin:'#f8d4b6',hair:'#4a2e22',hairHi:'#8a5a40',shoe:'#e8505b',
  tee:'#5fb3f0',tank:'#ffffff',long:'#d9454f',hoodie:'#7cc9a6',coat:'#c9925a',puffer:'#ff8a3d',
  pants:'#4a4f6a',jeans:'#4a6a96',shorts:'#d9b77e',scarf:'#f2b33d',beanie:'#3a7bd5',cap:'#e8505b',rain:'#ffd23f'};
const OUTFIT=['puffer','coat','hoodie','long','tee','tank','pants','jeans','shorts','raincoat'];

/* ---------- weather helpers ---------- */
const CODE={0:'晴朗',1:'大致晴朗',2:'多雲',3:'陰天',45:'起霧',48:'霧凇',51:'毛毛雨',53:'毛毛雨',55:'濃毛毛雨',56:'凍毛毛雨',57:'凍毛毛雨',61:'小雨',63:'中雨',65:'大雨',66:'凍雨',67:'強凍雨',71:'小雪',73:'中雪',75:'大雪',77:'霰',80:'陣雨',81:'強陣雨',82:'劇烈陣雨',85:'陣雪',86:'強陣雪',95:'雷雨',96:'雷雨夾冰雹',99:'強雷雨夾冰雹'};
function rainWord(t,r){if(r<=0.05)return t>=35?'炎熱無雨':t<=0?'嚴寒無雨':'無雨';
  if(t<=0.5)return r<3?'小雪':r<15?'大雪':'暴風雪';
  if(r<2.5)return'小雨';if(r<10)return'中雨';if(r<40)return'強降雨';if(r<100)return'豪雨等級';return'極端暴雨'}
function simCode(t,r){if(r<=0.05)return t>32?0:1;if(t<=0.5)return r>10?75:71;if(r>35)return 95;if(r>10)return 65;if(r>2.5)return 63;return 61}
function cloudOf(code,r){let c={0:.03,1:.25,2:.55,3:.9,45:.85,48:.85}[code];if(c==null)c=code>=95?1:.9;if(r>0.1)c=Math.max(c,.6+Math.min(.4,r/40));return c}
function depthFor(r){const P=[[8,0],[20,.12],[40,.35],[70,.75],[100,1.05],[130,1.36],[150,1.5]];if(r<=8)return 0;for(let i=1;i<P.length;i++)if(r<=P[i][0]){const a=P[i-1],b=P[i];return lerp(a[1],b[1],(r-a[0])/(b[0]-a[0]))}return 1.5}

function target(){
  if(st.mode==='real'&&st.real){const R=st.real;return{t:R.t,r:R.r,code:R.code,day:R.day,wind:clamp(R.wind/45,.05,1)}}
  const h=st.simHour??new Date().getHours(),s=st.sim;
  return{t:s.t,r:s.r,code:simCode(s.t,s.r),day:h>=6&&h<18?1:0,wind:clamp(.15+s.r/80,0,1)};
}
function personState(t,d){
  if(t<=-30)return{pose:'dead',cause:'cold',speed:0};
  if(t>=50)return{pose:'dead',cause:'heat',speed:0};
  if(d>=1.33)return{pose:'dead',cause:'water',speed:0,inWater:true};
  if(t<=-20)return{pose:'collapse',cause:'cold',speed:0};
  if(t>=44)return{pose:'collapse',cause:'heat',speed:0};
  if(d>=1.02)return{pose:'drown',speed:0,inWater:true};
  if(d>=.72)return{pose:'swim',speed:.45,inWater:true};
  let speed=1,pose='walk';
  if(d>=.33)speed=.35;else if(d>.08)speed=.7;
  if(t<=-8){pose='shiver';speed*=.45}else if(t<5)speed*=.85;
  if(t>=38){pose='stagger';speed*=.45}else if(t>=33)speed*=.8;
  if(st.snow>.12)speed*=.55;
  return{pose,speed};
}
const upright=S=>S.pose==='walk'||S.pose==='shiver'||S.pose==='stagger';

/* ---------- canvas sizing ---------- */
let W=300,H=400,DPR=1;
function resize(){const r=$('stage').getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(1,r.width);H=Math.max(1,r.height);cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px'}
new ResizeObserver(resize).observe($('stage'));resize();

/* ---------- scenery seeds ---------- */
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const BLD=[];for(let i=0;i<16;i++)BLD.push({w:.07+rnd()*.09,h:.12+rnd()*.3,win:rnd(),roof:rnd()});
const CLOUDS=[];for(let i=0;i<8;i++)CLOUDS.push({x:rnd(),y:.05+rnd()*.26,s:.6+rnd()*.8,v:.006+rnd()*.012});
const STARS=[];for(let i=0;i<60;i++)STARS.push({x:rnd(),y:rnd()*.55,r:.4+rnd()*1.2,p:rnd()*6});
const DEBRIS=[];for(let i=0;i<5;i++)DEBRIS.push({x:rnd(),k:i%3,p:rnd()*6});

/* ---------- particles ---------- */
const drops=[],flakes=[],parts=[];
for(let i=0;i<900;i++)drops.push({x:Math.random(),y:Math.random(),l:.6+Math.random()*.6,v:.8+Math.random()*.5});
for(let i=0;i<450;i++)flakes.push({x:Math.random(),y:Math.random(),r:1+Math.random()*2.4,v:.4+Math.random()*.6,p:Math.random()*6});
function spawn(o){if(parts.length<320)parts.push(o)}
const acc={sw:0,br:0,bb:0,st:0,ic:0,dp:0,lf:0};

/* ---------- geometry ---------- */
function geo(){const gy=H*.82,s=H*.3/108,cx=W*.42;return{gy,s,cx,surf:gy-st.water*100*s}}
function toWorld(lx,ly){const{gy,s,cx}=geo();const th=st.rot+(st.ang.tilt||0);const hx=cx+(st.ang.jx||0)*s,hy=gy-st.hipUp*s;
  return[hx+(lx*Math.cos(th)-ly*Math.sin(th))*s,hy+(lx*Math.sin(th)+ly*Math.cos(th))*s]}

/* ---------- update ---------- */
function update(dt){
  const tg=target(),c=st.cur,k=1-Math.exp(-dt*2.2);
  c.t+=(tg.t-c.t)*k;c.r+=(tg.r-c.r)*k;c.wind+=(tg.wind-c.wind)*k;c.day+=(tg.day-c.day)*(1-Math.exp(-dt*1.2));
  c.cloud+=(cloudOf(tg.code,tg.r)-c.cloud)*k;c.code=tg.code;
  const freezing=c.t<=.5;

      r:Math.max(j.current.precipitation||0,nowIdx>=0?hourly[nowIdx].r:0),hourly,nowIdx,at:Date.now(),place:null,usedGeo};
    let place=usedGeo?`${lat.toFixed(2)}, ${lon.toFixed(2)}`:'台北市';
    if(usedGeo){try{const g=await getJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh-Hant`);place=[g.city||g.principalSubdivision,g.locality].filter((v,i,a)=>v&&a.indexOf(v)===i).join(' ')||place}catch(e){}}
    R.place=place;st.real=R;st.realState='ok';st.lastFetch=Date.now();store.set('wx',R);
    showPlace();renderHours();
    notice(usedGeo?'':'沒有取得定位權限，先顯示台北的天氣。到 iPhone「設定 › 隱私權與安全性 › 定位服務」開啟 Safari 網站的定位後，再按右上角重新整理。');
    if(st.mode==='real')syncSliders(R.t,R.r);
  }catch(e){
    const cached=store.get('wx');
    if(cached&&cached.hourly){st.real=cached;st.realState='ok';showPlace(true);renderHours();notice('目前連不上網路，顯示上次抓到的天氣。');if(st.mode==='real')syncSliders(cached.t,cached.r)}
    else{st.realState='error';$('place').textContent='抓不到所在地';$('updated').textContent='天氣服務連線失敗';renderHours();
      notice('連不到天氣服務，所以「實際天氣」暫時沒有資料。如果你是在 Claude 的預覽畫面打開，預覽環境會封鎖定位與網路，這時請改用 index.html 安裝版（放上網站後加入主畫面）。在這裡仍可切到「模擬」使用。')}
  }finally{loading=false;$('refresh').classList.remove('spin');ui()}}
function showPlace(stale){const R=st.real;$('place').textContent=R.place||'目前位置';const d=new Date(R.at);
  $('updated').textContent=`${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} 更新${stale?'（離線）':''}`}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-st.lastFetch>15*60e3)loadReal()});
setInterval(()=>{if(!document.hidden)loadReal()},30*60e3);

/* ---------- loop ---------- */
let last=performance.now(),uiAcc=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;st.time+=dt;update(dt);draw();uiAcc+=dt;if(uiAcc>.15){uiAcc=0;ui()}requestAnimationFrame(frame)}
syncSliders(22,0);renderHours();ui();requestAnimationFrame(frame);loadReal();
})();
</script>
